name: StreamPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-and-codegen:
    name: Spec Validation & Codegen Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install jsonschema
      - name: Run Spec Checks
        run: |
          python spec/check.py
          python spec/codegen/generate.py --check

  server-and-dashboard:
    name: Backend Server & Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install & Test Server
        run: |
          cd server
          npm ci
          npm test
          npm run build
      - name: Install & Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

  web-sdk:
    name: Web SDK Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, Test & Build Web SDK
        run: |
          cd web
          npm ci
          npm test
          npm run build

  react-native:
    name: React Native Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, Test & Build React Native SDK
        run: |
          cd react-native
          npm install --legacy-peer-deps
          npm test
          npm run build

  kmp-core:
    name: Kotlin Multiplatform Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
      - name: Run KMP Core JVM Tests
        run: ./gradlew :core:jvmTest --no-daemon
